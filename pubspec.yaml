name: torugo_widgets
description: "A Flutter UI toolkit featuring a custom shadow painter that prevents shadows from bleeding through semi-transparent widget surfaces."
version: 0.2.1
homepage: https://github.com/vitor-hugo/torugo_widgets
topics: ["container", "shadow", "transparency", "widgets", "ui"]
platforms:
  android:
  ios:
  macos:
  linux:
  windows:

environment:
  sdk: ^3.13.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.1.0
  cupertino_ui: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
